<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">BestDoors logo</title>
  <desc id="desc">A modern open-door symbol above the BestDoors wordmark, in charcoal and orange.</desc>
  <defs>
    <linearGradient id="doorOrange" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff9d00"/>
      <stop offset="1" stop-color="#f04400"/>
    </linearGradient>
    <linearGradient id="floorShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe1e5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#aeb2ba" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- subtle threshold shadow -->
  <path d="M275 492 L548 420 L690 420 L480 492 Z" fill="url(#floorShadow)"/>
  <!-- dark door frame -->
  <path d="M468 100 Q468 94 475 96 L655 126 L655 158 L516 137 L516 426 Q516 431 510 433 L474 444 Q468 446 468 439 Z" fill="#20232d"/>
  <!-- open orange door -->
  <path d="M570 181 L746 91 Q755 86 755 96 L755 440 Q755 447 748 444 L570 386 Z" fill="url(#doorOrange)"/>
  <!-- handle -->
  <rect x="596" y="274" width="17" height="67" rx="8.5" fill="#ffffff"/>
  <!-- wordmark -->
  <text x="120" y="620" font-family="Arial, Helvetica, sans-serif" font-size="174" font-weight="700" letter-spacing="-8" fill="#20232d">Best</text>
  <text x="548" y="620" font-family="Arial, Helvetica, sans-serif" font-size="174" font-weight="700" letter-spacing="-8" fill="#f45a00">Doors</text>
</svg>
