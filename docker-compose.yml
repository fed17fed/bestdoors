services:
  postgres:
    image: postgres:16-alpine
    container_name: bestdoors-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bestdoors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # 5433 so it does not conflict with door-store-postgres on 5432
    ports:
      - "5433:5432"
    volumes:
      - bestdoors_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bestdoors"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bestdoors_data:
